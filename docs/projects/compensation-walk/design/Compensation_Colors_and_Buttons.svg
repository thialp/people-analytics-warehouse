erif" font-size="10.5" font-weight="400" fill="#5A6170" text-anchor="start">Control outlines on navy</text></g><g id="Swatch Rail active"><rect x="40" y="428" width="56" height="56" rx="6" fill="#1B3050" stroke="#E4E3DD" stroke-width="1"/><text x="108" y="448" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#13233A" text-anchor="start">Rail active</text><text x="108" y="466" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5A6170" text-anchor="start">#1B3050</text><text x="108" y="481" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6170" text-anchor="start">Active view row</text></g></g><text x="40" y="520" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#5A6170" text-anchor="start" letter-spacing="1.2">BUTTONS AND TOGGLES</text><g id="Buttons"><g id="Lens (on page)"><text x="40" y="559" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="start">Lens (on page)</text><rect x="220" y="540" width="120" height="30" rx="15" fill="#13233A" stroke="#13233A" stroke-width="1"/><text x="280.0" y="559" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Per FTE</text><rect x="354" y="540" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#13233A" stroke-width="1"/><text x="414.0" y="559" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="middle">Total</text></g><g id="Lens (on navy rail)"><text x="40" y="601" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="start">Lens (on navy rail)</text><rect x="208" y="576" width="276" height="42" rx="6" fill="#13233A"/><rect x="220" y="582" width="120" height="30" rx="15" fill="#13233A" stroke="#3A4A63" stroke-width="1"/><text x="280.0" y="601" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#C9D2E2" text-anchor="middle">Per FTE</text><rect x="354" y="582" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#3A4A63" stroke-width="1"/><text x="414.0" y="601" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="middle">Total</text></g><g id="Panel toggle"><text x="40" y="639" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="start">Panel toggle</text><rect x="220" y="620" width="120" height="30" rx="15" fill="#13233A" stroke="#13233A" stroke-width="1"/><text x="280.0" y="639" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Office moves</text><rect x="354" y="620" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#13233A" stroke-width="1"/><text x="414.0" y="639" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="middle">Career moves</text></g><g id="Cost (navy rail)"><text x="40" y="683" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="start">Cost (navy rail)</text><rect x="208" y="658" width="276" height="42" rx="6" fill="#13233A"/><rect x="220" y="664" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#3A4A63" stroke-width="1"/><text x="280.0" y="683" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="middle">Loaded</text><rect x="354" y="664" width="120" height="30" rx="15" fill="#13233A" stroke="#3A4A63" stroke-width="1"/><text x="414.0" y="683" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#C9D2E2" text-anchor="middle">Base</text></g><g id="Currency (navy rail)"><text x="40" y="725" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="start">Currency (navy rail)</text><rect x="208" y="700" width="276" height="42" rx="6" fill="#13233A"/><rect x="220" y="706" width="120" height="30" rx="15" fill="#13233A" stroke="#3A4A63" stroke-width="1"/><text x="280.0" y="725" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#C9D2E2" text-anchor="middle">Constant FX</text><rect x="354" y="706" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#3A4A63" stroke-width="1"/><text x="414.0" y="725" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#13233A" text-anchor="middle">Nominal</text></g></g><g id="Notes"><text x="40" y="780" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6170" text-anchor="start">State rules: On = filled (white on navy rail, navy on page). Off = outline only. Capsule radius 15 (Tableau Corner Radius 16). Cards radius 10. Rail controls radius 0.</text><text x="40" y="798" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6170" text-anchor="start">Each toggle is a parameter (p_Lens, p_Cost, p_Currency, p_Panel). Use one custom-shape PNG per state, as in Dashboard #1 (Header/Pill Shape).</text></g></svg>